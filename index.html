<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Sudoku" />
<meta name="format-detection" content="telephone=no" />
<title>Sudoku</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
<link rel="apple-touch-icon" href="assets/icons/icon-180.png" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <main id="app" class="app" aria-label="Sudoku">

    <!-- ============ HEADER ============ -->
    <header class="header">
      <div class="header-top">
        <button class="icon-btn" id="btn-new-game" aria-label="新しいゲーム" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/></svg>
        </button>
        <div class="header-title" id="score-display">0</div>
        <div class="header-actions">
          <button class="icon-btn" id="btn-theme" aria-label="テーマ切替" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36A5.4 5.4 0 0112 3z" fill="currentColor"/></svg>
          </button>
          <button class="icon-btn" id="btn-settings" aria-label="設定" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94a7.49 7.49 0 000-1.88l2.03-1.58a.5.5 0 00.12-.64l-1.92-3.32a.5.5 0 00-.6-.22l-2.39.96a7.41 7.41 0 00-1.63-.94l-.36-2.54a.5.5 0 00-.5-.42h-3.84a.5.5 0 00-.5.42l-.36 2.54a7.41 7.41 0 00-1.63.94l-2.39-.96a.5.5 0 00-.6.22L2.71 8.84a.5.5 0 00.12.64l2.03 1.58a7.49 7.49 0 000 1.88L2.83 14.52a.5.5 0 00-.12.64l1.92 3.32a.5.5 0 00.6.22l2.39-.96c.5.38 1.05.7 1.63.94l.36 2.54a.5.5 0 00.5.42h3.84a.5.5 0 00.5-.42l.36-2.54c.58-.24 1.13-.56 1.63-.94l2.39.96a.5.5 0 00.6-.22l1.92-3.32a.5.5 0 00-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1115.5 12 3.5 3.5 0 0112 15.5z" fill="currentColor"/></svg>
          </button>
        </div>
      </div>

      <div class="header-stats">
        <div class="stat">
          <div class="stat-label"><span aria-hidden="true">🏆</span> 通算</div>
          <div class="stat-value" id="stat-total">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">難易度</div>
          <div class="stat-value" id="stat-difficulty">エクストリーム</div>
        </div>
        <div class="stat">
          <div class="stat-label">間違い</div>
          <div class="stat-value" id="stat-mistakes">0/3</div>
        </div>
        <div class="stat">
          <div class="stat-label">タイム</div>
          <div class="stat-value" id="stat-time">00:00</div>
        </div>
        <button class="icon-btn pause-btn" id="btn-pause" aria-label="一時停止" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h3v14H8zM13 5h3v14h-3z" fill="currentColor"/></svg>
        </button>
      </div>
    </header>

    <!-- ============ BOARD ============ -->
    <section class="board-wrap" aria-label="Sudoku board">
      <div class="board" id="board" role="grid" aria-rowcount="9" aria-colcount="9"></div>
      <div class="board-overlay" id="board-overlay" hidden>
        <button class="board-overlay-btn" id="btn-resume" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
          <span>再開</span>
        </button>
      </div>
    </section>

    <!-- ============ ACTION BAR ============ -->
    <nav class="action-bar" aria-label="アクション">
      <button class="action" id="btn-undo" type="button" aria-label="元に戻す">
        <span class="action-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 5V2L6 7l6 5V8a6 6 0 016 6 6 6 0 01-6 6 6 6 0 01-6-6H4a8 8 0 008 8 8 8 0 008-8 8 8 0 00-8-8z" fill="currentColor"/></svg>
        </span>
        <span class="action-label">元に戻す</span>
      </button>
      <button class="action" id="btn-erase" type="button" aria-label="消す">
        <span class="action-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M16.24 3.56l4.2 4.2a2 2 0 010 2.83l-8.49 8.49a2 2 0 01-2.83 0l-5.66-5.66a2 2 0 010-2.83l8.49-8.49a2 2 0 012.83 0zM9.41 18.59l1.42-1.42-5.66-5.66-1.42 1.42 5.66 5.66z" fill="currentColor"/></svg>
        </span>
        <span class="action-label">消す</span>
      </button>
      <button class="action" id="btn-memo" type="button" aria-pressed="false" aria-label="メモモード">
        <span class="action-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor"/></svg>
          <span class="action-badge action-badge--off" id="memo-badge">OFF</span>
        </span>
        <span class="action-label">メモ</span>
      </button>
      <button class="action" id="btn-hint" type="button" aria-label="ヒント">
        <span class="action-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M9 21h6v-1H9v1zm3-19a7 7 0 00-4 12.74V17a1 1 0 001 1h6a1 1 0 001-1v-2.26A7 7 0 0012 2z" fill="currentColor"/></svg>
          <span class="action-badge action-badge--count" id="hint-badge">1</span>
        </span>
        <span class="action-label">ヒント</span>
      </button>
    </nav>

    <!-- ============ NUMBER PAD ============ -->
    <nav class="number-pad" id="number-pad" aria-label="数字パッド"></nav>

  </main>

  <!-- Hint toast -->
  <div class="hint-toast" id="hint-toast" role="status" aria-live="polite" hidden></div>

  <!-- ARIA live region for status changes -->
  <div class="sr-only" id="live-region" role="status" aria-live="polite" aria-atomic="true"></div>

  <!-- Loading overlay during puzzle generation -->
  <div class="loading-overlay" id="loading" hidden aria-hidden="true">
    <div class="spinner" aria-hidden="true"></div>
    <div class="loading-text">パズルを生成中…</div>
  </div>

  <!-- ============ DIALOGS ============ -->
  <div class="dialog-root" id="dialog-root" hidden>
    <!-- Settings dialog -->
    <div class="dialog" id="dialog-settings" hidden role="dialog" aria-modal="true" aria-labelledby="dialog-settings-title">
      <h2 class="dialog-title" id="dialog-settings-title">設定</h2>
      <ul class="settings-list">
        <li>
          <span>ダークモード</span>
          <label class="switch"><input type="checkbox" id="opt-dark"><span class="track"></span></label>
        </li>
        <li>
          <span>サウンド</span>
          <label class="switch"><input type="checkbox" id="opt-sound"><span class="track"></span></label>
        </li>
        <li>
          <span>同じ数字を強調</span>
          <label class="switch"><input type="checkbox" id="opt-highlight"><span class="track"></span></label>
        </li>
        <li>
          <span>メモを自動削除</span>
          <label class="switch"><input type="checkbox" id="opt-autonotes"><span class="track"></span></label>
        </li>
        <li>
          <span>触覚フィードバック</span>
          <label class="switch"><input type="checkbox" id="opt-haptics"><span class="track"></span></label>
        </li>
      </ul>

      <h3 class="dialog-subtitle">統計</h3>
      <ul class="stats-list" id="stats-list"></ul>

      <div class="dialog-actions">
        <button class="btn-secondary" id="btn-reset-stats" type="button">統計をリセット</button>
        <button class="btn-primary" id="btn-close-settings" type="button">閉じる</button>
      </div>
    </div>

    <!-- New Game dialog -->
    <div class="dialog" id="dialog-new" hidden role="dialog" aria-modal="true" aria-labelledby="dialog-new-title">
      <h2 class="dialog-title" id="dialog-new-title">新しいゲーム</h2>
      <p class="dialog-desc">難易度を選んでください</p>
      <ul class="diff-list">
        <li><button class="diff-btn" data-diff="easy" type="button">やさしい</button></li>
        <li><button class="diff-btn" data-diff="medium" type="button">ふつう</button></li>
        <li><button class="diff-btn" data-diff="hard" type="button">むずかしい</button></li>
        <li><button class="diff-btn" data-diff="expert" type="button">エキスパート</button></li>
        <li><button class="diff-btn diff-btn--accent" data-diff="extreme" type="button">エクストリーム</button></li>
      </ul>
      <div class="dialog-actions">
        <button class="btn-secondary" id="btn-close-new" type="button">キャンセル</button>
      </div>
    </div>

    <!-- Game Over dialog -->
    <div class="dialog" id="dialog-gameover" hidden role="alertdialog" aria-modal="true" aria-labelledby="dialog-gameover-title">
      <h2 class="dialog-title" id="dialog-gameover-title">ゲームオーバー</h2>
      <p class="dialog-desc">間違いが3回に達しました。</p>
      <div class="dialog-actions">
        <button class="btn-secondary" id="btn-restart" type="button">最初からやり直す</button>
        <button class="btn-primary" id="btn-new-after-over" type="button">新しいゲーム</button>
      </div>
    </div>

    <!-- Victory dialog -->
    <div class="dialog" id="dialog-victory" hidden role="alertdialog" aria-modal="true" aria-labelledby="dialog-victory-title">
      <div class="confetti" aria-hidden="true"></div>
      <h2 class="dialog-title" id="dialog-victory-title">クリア!</h2>
      <p class="dialog-desc" id="victory-desc">おめでとうございます</p>
      <div class="dialog-actions">
        <button class="btn-primary" id="btn-new-after-win" type="button">新しいゲーム</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
